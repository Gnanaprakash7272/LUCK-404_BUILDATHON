<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Campus Portal · Kalaignar Karunanidhi Institute Of Technology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,440;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14140f;
    --ink-2:#1c1a13;
    --gold:#e8b430;
    --gold-soft:#f3d375;
    --maroon:#8c1f2b;
    --paper:#f7f3e8;
    --paper-dim:#c9c3b2;
    --radius:20px;
  }

  *,*::before,*::after{ box-sizing:border-box; }

  html,body{ height:100%; margin:0; }

  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--paper);
    background:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  .visually-hidden{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  a{ color:inherit; }

  /* ---------- layout shell ---------- */

  .page{
    position:relative;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
  }

  .hero-media{
    position:fixed;
    inset:0;
    z-index:0;
    background:var(--ink);
  }

  .bg-video{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 38%;
    display:block;
  }

  .scrim{
    position:absolute;
    inset:0;
    background:
      linear-gradient(122deg,
        rgba(18,17,12,.10) 0%,
        rgba(18,17,12,.28) 34%,
        rgba(18,17,12,.62) 58%,
        rgba(18,17,12,.88) 100%),
      linear-gradient(to top, rgba(10,10,7,.5) 0%, rgba(10,10,7,0) 32%);
  }

  /* ---------- topbar / brandmark ---------- */

  .topbar{
    position:relative;
    z-index:2;
    flex:0 0 auto;
    padding:30px 36px;
  }

  .brandmark{
    display:inline-flex;
    align-items:center;
    gap:12px;
  }

  .brandmark .mark{
    flex:none;
    width:38px; height:38px;
    border-radius:9px;
    background:linear-gradient(135deg,var(--gold),var(--maroon));
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:.02em;
    color:var(--ink);
  }

  .brandmark .name{
    display:none;
    line-height:1.35;
  }

  .brandmark .name .l1{
    display:block;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--paper);
  }

  .brandmark .name .l2{
    display:block;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--paper-dim);
  }

  /* ---------- panel / card ---------- */

  .panel-wrap{
    position:relative;
    z-index:2;
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 36px;
  }

  .card{
    position:relative;
    width:min(420px, 100%);
    background:rgba(20,19,15,.58);
    backdrop-filter:blur(20px) saturate(150%);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    border:1px solid rgba(247,243,232,.14);
    border-radius:var(--radius);
    padding:38px 34px 30px;
    box-shadow:0 30px 70px -25px rgba(0,0,0,.65);
    overflow:hidden;
  }

  .card::before{
    content:'';
    position:absolute;
    top:0; left:26px; right:26px; height:3px;
    background:linear-gradient(90deg, var(--gold), var(--gold-soft) 45%, var(--maroon) 100%);
    border-radius:0 0 3px 3px;
    transform-origin:left center;
    transform:scaleX(0);
    animation:draw-in .9s cubic-bezier(.16,1,.3,1) .25s forwards;
  }

  @keyframes draw-in{ to{ transform:scaleX(1); } }

  .reveal{
    opacity:0;
    transform:translateY(10px);
    animation:reveal-in .6s cubic-bezier(.16,1,.3,1) forwards;
    animation-delay:calc(var(--d, 0) * 70ms + 420ms);
  }

  @keyframes reveal-in{ to{ opacity:1; transform:none; } }

  .card h1{
    margin:0 0 6px;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:30px;
    letter-spacing:-.01em;
    color:var(--paper);
  }

  .card h1 em{
    font-style:italic;
    font-weight:500;
    color:var(--gold-soft);
  }

  .card .subhead{
    margin:0 0 26px;
    font-size:14px;
    line-height:1.55;
    color:var(--paper-dim);
    max-width:34ch;
  }

  /* ---------- role switch ---------- */

  .tabs{
    border:0;
    margin:0 0 24px;
    padding:4px;
    display:flex;
    gap:4px;
    background:rgba(0,0,0,.28);
    border-radius:999px;
  }

  .tabs legend{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }

  .tab{
    flex:1 1 0;
    position:relative;
    text-align:center;
    border-radius:999px;
    cursor:pointer;
  }

  .tab input{
    position:absolute;
    inset:0;
    opacity:0;
    margin:0;
    cursor:pointer;
  }

  .tab span{
    display:block;
    padding:9px 0;
    font-size:13px;
    font-weight:500;
    letter-spacing:.02em;
    color:var(--paper-dim);
    border-radius:999px;
    transition:background .25s ease, color .25s ease;
  }

  .tab input:checked + span{
    background:var(--gold);
    color:var(--ink);
    font-weight:700;
  }

  .tab input:focus-visible + span{
    outline:2px solid var(--paper);
    outline-offset:2px;
  }

  /* ---------- form fields ---------- */

  .field{
    margin-bottom:16px;
    display:flex;
    flex-direction:column;
    gap:7px;
  }

  .field label{
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--paper-dim);
  }

  .field input{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--paper);
    background:rgba(247,243,232,.06);
    border:1px solid rgba(247,243,232,.18);
    border-radius:11px;
    padding:12px 14px;
    transition:border-color .2s ease, background .2s ease;
  }

  .field input::placeholder{ color:rgba(201,195,178,.48); }

  .field input:hover{ border-color:rgba(247,243,232,.32); }

  .field input:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:1px;
    border-color:var(--gold);
  }

  .pw-wrap{ position:relative; }

  .pw-wrap input{ padding-right:44px; }

  .pw-toggle{
    position:absolute;
    top:50%; right:6px;
    transform:translateY(-50%);
    width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    border:0;
    border-radius:8px;
    color:var(--paper-dim);
    cursor:pointer;
  }

  .pw-toggle:hover{ color:var(--paper); background:rgba(247,243,232,.08); }

  .pw-toggle:focus-visible{ outline:2px solid var(--gold); outline-offset:1px; }

  .pw-toggle svg{ width:18px; height:18px; }

  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin:6px 0 22px;
    font-size:13px;
  }

  .remember{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--paper-dim);
    cursor:pointer;
  }

  .remember input{
    width:15px; height:15px;
    accent-color:var(--gold);
    cursor:pointer;
  }

  .forgot-link{
    color:var(--paper-dim);
    text-decoration:underline;
    text-decoration-color:rgba(201,195,178,.4);
    text-underline-offset:3px;
    font-size:13px;
    background:none;
    border:0;
    padding:0;
    cursor:pointer;
    font-family:inherit;
  }

  .forgot-link:hover{ color:var(--paper); text-decoration-color:var(--gold); }

  .forgot-link:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

  .btn-primary{
    width:100%;
    padding:14px 0;
    border:0;
    border-radius:11px;
    background:linear-gradient(135deg, var(--gold), var(--gold-soft));
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:.01em;
    cursor:pointer;
    box-shadow:0 14px 28px -10px rgba(232,180,48,.55);
    transition:transform .15s ease, box-shadow .15s ease;
  }

  .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 18px 34px -10px rgba(232,180,48,.7); }

  .btn-primary:active{ transform:translateY(0); }

  .btn-primary:focus-visible{ outline:2px solid var(--paper); outline-offset:3px; }

  .form-note{
    min-height:18px;
    margin:14px 2px 0;
    font-size:12.5px;
    line-height:1.5;
    color:var(--gold-soft);
  }

  .help-line{
    margin:18px 0 0;
    padding-top:16px;
    border-top:1px solid rgba(247,243,232,.12);
    font-size:12.5px;
    color:var(--paper-dim);
  }

  .help-line b{ color:var(--paper); font-weight:600; }

  /* ---------- footer ---------- */

  .foot{
    position:relative;
    z-index:2;
    flex:0 0 auto;
    padding:18px 36px 22px;
    font-size:12px;
    color:var(--paper-dim);
  }

  /* ---------- reduced motion ---------- */

  @media (prefers-reduced-motion:reduce){
    .card::before{ animation:none; transform:scaleX(1); }
    .reveal{ animation:none; opacity:1; transform:none; }
    .btn-primary:hover{ transform:none; }
  }

  /* ---------- mobile ---------- */

  @media (max-width:720px){
    .hero-media{
      position:relative;
      inset:auto;
      order:2;
      height:34vh;
      min-height:210px;
      max-height:320px;
      border-radius:0 0 26px 26px;
      overflow:hidden;
    }

    .bg-video{ object-position:center 42%; }

    .scrim{
      background:linear-gradient(to top, rgba(18,17,12,.9) 0%, rgba(18,17,12,0) 55%);
    }

    .topbar{ order:1; padding:20px 22px; }

    .brandmark .name{ display:block; }

    .panel-wrap{
      order:3;
      justify-content:center;
      align-items:flex-start;
      padding:26px 20px 6px;
      background:var(--ink);
    }

    .card{ width:100%; padding:32px 24px 26px; }

    .foot{ order:4; text-align:center; background:var(--ink); padding:6px 20px 26px; }
  }

  @media (max-width:380px){
    .card h1{ font-size:26px; }
  }
</style>
</head>

<script>
(function(){
  "use strict";

  var video = document.querySelector('.bg-video');
  var motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');

  function applyMotionPref(){
    if(!video) return;
    if(motionQuery.matches){
      video.pause();
    } else {
      video.play().catch(function(){ /* autoplay may be blocked; poster still shows */ });
    }
  }
  applyMotionPref();
  if(motionQuery.addEventListener){ motionQuery.addEventListener('change', applyMotionPref); }

  var idLabel = document.getElementById('idLabel');
  var idInput = document.getElementById('idInput');
  var roleGroup = document.getElementById('roleGroup');

  roleGroup.addEventListener('change', function(e){
    if(e.target.name !== 'role') return;
    if(e.target.value === 'staff'){
      idLabel.textContent = 'Staff ID';
      idInput.placeholder = 'Enter your staff ID';
    } else {
      idLabel.textContent = 'Register Number';
      idInput.placeholder = 'Enter your register number';
    }
    idInput.value = '';
  });

  var pwInput = document.getElementById('pwInput');
  var pwToggle = document.querySelector('.pw-toggle');
  var eyeOn = document.querySelector('.icon-eye');
  var eyeOff = document.querySelector('.icon-eye-off');

  pwToggle.addEventListener('click', function(){
    var showing = pwInput.type === 'text';
    pwInput.type = showing ? 'password' : 'text';
    pwToggle.setAttribute('aria-pressed', String(!showing));
    pwToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    eyeOn.style.display = showing ? '' : 'none';
    eyeOff.style.display = showing ? 'none' : '';
  });

  var form = document.querySelector('.login-form');
  var note = document.querySelector('.form-note');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    note.textContent = 'This is a front-end template — connect this form to your authentication API to enable sign-in.';
  });

  document.querySelector('.forgot-link').addEventListener('click', function(){
    note.textContent = 'Contact the IT helpdesk to reset your password.';
  });

})();
</script>

</body>
</html>
